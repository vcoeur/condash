<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Search latency, helio 0.2 versus 0.3">
  <rect width="640" height="320" fill="#fbfaf7" />
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#22201c">Search latency — 0.2 vs 0.3</text>
  <text x="32" y="68" font-family="sans-serif" font-size="13" fill="#6b675f">p50, seconds, warm cache</text>

  <line x1="120" y1="100" x2="120" y2="264" stroke="#c9c4ba" stroke-width="1" />
  <line x1="120" y1="264" x2="600" y2="264" stroke="#c9c4ba" stroke-width="1" />

  <text x="112" y="128" text-anchor="end" font-family="sans-serif" font-size="13" fill="#6b675f">120 MB</text>
  <rect x="122" y="112" width="96" height="18" fill="#b8b1a4" />
  <rect x="122" y="134" width="12" height="18" fill="#3f7d58" />

  <text x="112" y="184" text-anchor="end" font-family="sans-serif" font-size="13" fill="#6b675f">500 MB</text>
  <rect x="122" y="168" width="300" height="18" fill="#b8b1a4" />
  <rect x="122" y="190" width="20" height="18" fill="#3f7d58" />

  <text x="112" y="240" text-anchor="end" font-family="sans-serif" font-size="13" fill="#6b675f">2.3 GB</text>
  <rect x="122" y="224" width="470" height="18" fill="#b8b1a4" />
  <rect x="122" y="246" width="26" height="18" fill="#3f7d58" />

  <rect x="122" y="286" width="12" height="12" fill="#b8b1a4" />
  <text x="142" y="296" font-family="sans-serif" font-size="12" fill="#6b675f">0.2 — full scan</text>
  <rect x="252" y="286" width="12" height="12" fill="#3f7d58" />
  <text x="272" y="296" font-family="sans-serif" font-size="12" fill="#6b675f">0.3 — trigram index</text>
</svg>
