site_name: condash
site_url: https://condash.vcoeur.com/
site_description: Standalone Electron desktop dashboard for markdown-based projects, incidents, and documents — live-rendered from the files you edit by hand.
site_author: Alice Voland
copyright: 'Developed by Alice Voland &middot; <a href="https://vcoeur.com">vcoeur.com</a> &middot; <a href="/legal/">Legal</a>'

repo_url: https://github.com/vcoeur/condash
repo_name: vcoeur/condash
edit_uri: edit/main/docs/

theme:
  name: material
  font: false
  favicon: assets/condash-mark.svg
  logo: assets/condash-mark.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vcoeur/condash

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# The six `docs/help/*.md` bodies are the *in-app* Help menu pages: `src/main/help.ts`
# reads them out of the packaged asar through a filename allowlist, so they must stay
# in `docs/` and must keep their names. They are published (their absolute
# condash.vcoeur.com links have to resolve, and the app's "Open documentation site"
# entry lands on the same host) but deliberately kept out of the nav, where they would
# duplicate `get-started/`. Declaring them here is what stops every build reporting
# them as accidental orphans.
not_in_nav: |
  /help/*.md

nav:
  - Home: index.md

  - Get started:
    - get-started/index.md
    - Releases: get-started/releases.md

  - Tutorials:
    - tutorials/index.md
    - A day with condash: tutorials/daily-loop.md
    - Work in a branch-isolated worktree: tutorials/worktrees.md
    - condash without the window: tutorials/cli-only.md

  - Guides:
    - guides/index.md
    - Configure the conception path: guides/configure-conception-path.md
    - Repositories and open-with launchers: guides/repositories-and-open-with.md
    - The Settings modal: guides/settings-modal.md
    - Applications and handles: guides/applications-and-handles.md
    - Auto-commit: guides/auto-commit.md
    - Use the embedded terminal: guides/terminal.md
    - Dashboard band (tab summaries): guides/dashboard.md
    - Agent CLIs and model providers: guides/agent-clis-and-models.md
    - The Projects pane: guides/projects-pane.md
    - The Code pane: guides/code-pane.md
    - The Tasks pane: guides/tasks-pane.md
    - The Deliverables pane: guides/deliverables-pane.md
    - The Performance pane: guides/performance-pane.md
    - The knowledge tree: guides/knowledge-tree.md
    - The Resources pane: guides/resources-pane.md
    - The Skills pane: guides/skills-pane.md
    - The Logs pane: guides/logs-pane.md
    - Search: guides/search.md
    - Link items with wikilinks: guides/wikilinks.md
    - Deliverables and PDFs: guides/deliverables.md
    - Visual notes (plans, reviews, designs): guides/plan-documents.md
    - Extend the management skills: guides/skill-extensions.md
    - Dev launch from a clone: guides/dev-launch.md
    - Troubleshooting: guides/troubleshooting.md

  - Reference:
    - reference/index.md
    - CLI: reference/cli.md
    - Config files: reference/config.md
    - Keyboard shortcuts: reference/shortcuts.md
    - README format: reference/readme-format.md
    - Status, steps, deliverables: reference/conception-convention.md
    - AGENTS.md style guide: reference/agents-md-style.md
    - Advanced:
      - Mutation model: reference/mutations.md
      - Inline dev-server runner: reference/inline-runner.md
      - IPC API: reference/ipc-api.md
      - Environment variables: reference/env.md
      - Management skill: reference/skill.md

  - Background:
    - explanation/index.md
    - Why Markdown-first: explanation/why-markdown.md
    - Non-goals: explanation/non-goals.md
    - Advanced:
      - Values: explanation/values.md
      - Internals: explanation/internals.md
      - Contributing: explanation/contributing.md

  - Legal: legal.md
