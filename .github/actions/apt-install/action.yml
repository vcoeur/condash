name: Bounded apt install
description: >-
  Install apt packages under a hard time bound, and install this repo's apt
  policy for the whole job, so a stalled runner mirror fails fast instead of
  consuming the job's budget.

# WHY: on release run 32231104488 (v4.111.0) an unbounded `apt-get update`
# went silent for 23 m 53 s when the runner's azure mirror went down and the
# archive.ubuntu.com fallback stalled mid-index. That ate a job budget sized
# for the test suite, skipped `build`/`publish`, and left the tag with no
# Release.
#
# THIS ACTION OWNS THE APT POLICY FOR THE JOB. It writes
# /etc/apt/apt.conf.d/99-ci-timeouts first — before input validation and before
# the skip probe, so the policy lands even when the install is skipped and even
# when a caller passes something invalid.
# That matters because it is the only lever on apt nested inside something
# else: `npx playwright install --with-deps` shells out to apt internally,
# where no argument of ours can reach. Having one owner also stops the policy
# drifting between lanes, which it did while each site configured its own.
#
# WHAT THIS DELIBERATELY DOES NOT DO: retry. Three earlier versions wrapped apt
# in a retry loop and each was wrong in a new way; the last nested a 4x30 s
# `Acquire::Retries` budget inside a 90 s external bound, so two of its four
# "chances" were unreachable. Retries also forced a dpkg repair path, a
# multi-leg budget computed wrong three tries running, and a second copy of
# this policy. v4.111.0 was a STALL, not a transient error — a fast, loud
# failure serves it better than a retry. Re-running the lane is the retry.
#
# The two knobs that ARE kept are waits, not retries. They are SEQUENTIAL, not
# alternatives — one install can wait out the dpkg lock and THEN stall on a
# .deb URI — so the bound must hold their SUM, not each of them separately.
# Checking them individually is what a previous version did, and 120 + 120 =
# 240 s does not fit in the 180 s it called safe. The script now computes the
# sum and asserts against that:
#   DPkg::Lock::Timeout                     120 s
# + (Acquire::Retries + 1) x http::Timeout  120 s
# = 240 s, which is why the default bound is 300 s, not 180.

inputs:
  packages:
    description: >-
      Space-separated package names. Deliberately word-split, so
      "aptly gnupg" installs two packages.
    required: true
  skip-if-command:
    description: >-
      If this command is already on PATH, skip the install and succeed (the apt
      policy above is still written). Name the binary the consumer actually
      executes, not a sibling from the same package — the probe is the
      contract, so it should fail when the thing that gets run is missing.
      Only valid for a single-package install: the probe short-circuits the
      install, so with several packages a hit on one would skip the rest.
    required: false
    default: ''
  timeout-seconds:
    description: >-
      Hard bound on EACH of the two apt-get calls. Worst case is
      2 x (this + 30 s SIGKILL grace). Must exceed the SUM of the apt waits
      above (240 s); the script computes that sum and enforces it. Raise it for
      a site with a large payload rather than tuning the default for everyone.
    required: false
    default: '300'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        SKIP_IF_COMMAND: ${{ inputs.skip-if-command }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        # $PACKAGES is intentionally word-split below; -f stops it also being
        # glob-expanded against the workspace, where a name containing * or [
        # would otherwise turn into a list of repo filenames.
        set -f

        # Two separate constants, not one reused for both. A single shared
        # value silently coupled the dpkg lock wait to the acquire budget, so
        # tuning either one invalidated the assert with no code change to flag
        # it. The acquire budget is COMPUTED from the retry count so it stays
        # true if that changes.
        LOCK_WAIT=120
        ACQUIRE_RETRIES=3
        ACQUIRE_TIMEOUT=30
        ACQUIRE_BUDGET=$(( (ACQUIRE_RETRIES + 1) * ACQUIRE_TIMEOUT ))
        WAIT_TOTAL=$(( LOCK_WAIT + ACQUIRE_BUDGET ))

        # Written FIRST — before validation and before the probe — so the policy
        # lands for the whole job whatever happens next. It is the only lever on
        # apt nested inside something else (`playwright install --with-deps`),
        # and that nested call runs in a later step which would otherwise
        # inherit nothing if this action exits early.
        echo "::group::apt policy"
        sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<APTCONF
        Acquire::Retries "$ACQUIRE_RETRIES";
        Acquire::http::Timeout "$ACQUIRE_TIMEOUT";
        Acquire::https::Timeout "$ACQUIRE_TIMEOUT";
        DPkg::Lock::Timeout "$LOCK_WAIT";
        APTCONF
        echo "apt policy: lock wait ${LOCK_WAIT}s + acquire ${ACQUIRE_BUDGET}s = ${WAIT_TOTAL}s must fit the bound"
        echo "::endgroup::"

        # `required: true` is documentation, not enforcement — the runner does
        # not fail a missing input, and `apt-get install -y` with zero operands
        # exits 0. Strip ALL whitespace: a tab or newline from a YAML block
        # scalar would otherwise slip through into that silent success.
        if [ -z "${PACKAGES//[[:space:]]/}" ]; then
          echo "apt-install: 'packages' input is empty" >&2
          exit 1
        fi

        # The bound is load-bearing, so validate it rather than trusting the
        # caller — an empty or non-numeric value would reach `timeout -k 30 ""`
        # and exit 125 at the first apt call, looking like an unbounded failure.
        if ! [[ "$TIMEOUT_SECONDS" =~ ^[0-9]+$ ]]; then
          echo "apt-install: timeout-seconds must be a whole number (got: '$TIMEOUT_SECONDS')" >&2
          exit 1
        fi
        # The SUM, because the waits are sequential: an install can wait out the
        # dpkg lock and then stall on a .deb URI within the same invocation.
        if [ "$TIMEOUT_SECONDS" -le "$WAIT_TOTAL" ]; then
          echo "apt-install: timeout-seconds ($TIMEOUT_SECONDS) must exceed the combined apt waits (${LOCK_WAIT}+${ACQUIRE_BUDGET}=${WAIT_TOTAL}s), or they cannot complete inside it" >&2
          exit 1
        fi

        if [ -n "$SKIP_IF_COMMAND" ]; then
          # The probe short-circuits the install, so it cannot speak for a list.
          # `printf`, not `echo`: the builtin swallows a leading -n/-e, so a
          # package literally named "-n" would count as zero words and slip past.
          if [ "$(printf '%s\n' "$PACKAGES" | wc -w)" -gt 1 ]; then
            echo "apt-install: skip-if-command is only valid for a single package (got: $PACKAGES)" >&2
            exit 1
          fi
          # `type -P` not `command -v`: the latter also resolves builtins,
          # functions and keywords, so probing a name like `test` or `printf`
          # would hit unconditionally and skip the install forever.
          if probe_path=$(type -P "$SKIP_IF_COMMAND"); then
            echo "$SKIP_IF_COMMAND already on the image at $probe_path — skipping install"
            exit 0
          fi
          # Loud, and outside the collapsed groups below: this line is the only
          # signal that the runner image stopped shipping the package, which is
          # the whole event the fallback exists for.
          echo "apt-install: $SKIP_IF_COMMAND is NOT on this runner image — falling back to apt" >&2
        fi

        # `sudo timeout`, not `timeout sudo`, so timeout runs as root and
        # signals apt-get directly rather than relying on sudo to forward it.
        # `-k` is load-bearing: without it `timeout` sends SIGTERM and then
        # waits forever, and apt-get traps SIGTERM to release the dpkg lock.
        # Verified against a trapping child, which outlived a bare `timeout`.
        bounded() { sudo timeout -k 30 "$TIMEOUT_SECONDS" "$@"; }

        # Both legs are wrapped in `if`. Left bare under `set -e` a failure
        # exits mid-group, so the runner folds the error into a collapsed log
        # group and none of this script's own diagnostics print — the quiet
        # failure being avoided here is on the update leg, which is the leg
        # that actually failed in v4.111.0. The exit code is echoed rather than
        # named in prose: a plain bound gives 124, but the `-k` escalation
        # SIGKILLs `timeout` itself and surfaces as 137.
        echo "::group::apt-get update"
        # `rc=0; cmd || rc=$?` rather than `if ! cmd; then rc=$?`: inside the
        # body of `if !` the status has already been negated, so $? reads 0 and
        # the diagnostic reports success for a failure.
        rc=0
        bounded apt-get update || rc=$?
        echo "::endgroup::"
        if [ "$rc" -ne 0 ]; then
          echo "apt-install: apt-get update failed (exit $rc; 124/137 mean it hit the ${TIMEOUT_SECONDS}s bound)" >&2
          exit 1
        fi

        echo "::group::apt-get install $PACKAGES"
        # DEBIAN_FRONTEND goes through `env` because sudo's env_reset drops it:
        # installing a package runs its postinst, and a debconf prompt there
        # would block on stdin until the bound kills it.
        rc=0
        bounded env DEBIAN_FRONTEND=noninteractive apt-get install -y $PACKAGES || rc=$?
        echo "::endgroup::"
        if [ "$rc" -eq 0 ]; then
          exit 0
        fi

        # No dpkg repair here, deliberately. An earlier version ran
        # `dpkg --configure -a` plus `apt-get install -f` on the way out to stop
        # a killed unpack poisoning later apt calls. Nothing in this repo runs
        # apt after a failure — the only `if: failure()` step in any of the six
        # workflows is `_playwright.yml`'s upload-artifact, which does not — so
        # it protected nothing, while adding 140 s to every worst-case budget
        # and risking worse damage than it repaired (SIGKILLing dpkg mid
        # maintainer-script, or `install -f` removing packages) on a runner
        # about to be discarded. Restore it if a caller ever adds an
        # apt-touching failure-path step.
        echo "apt-install: could not install $PACKAGES (exit $rc)" >&2
        exit 1
