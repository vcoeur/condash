name: _playwright

# Reusable Electron Playwright lane (Ubuntu + xvfb). Called only by
# release.yml (second stage of the real gate at tag time). Never publishes
# anything.

on:
  workflow_call:

# Least privilege: test-only — checkout, caches, and artifact upload need no
# contents writes (artifact upload uses the runtime token, not GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  playwright:
    name: Playwright suite
    runs-on: ubuntu-latest
    # The settings-modal-audit spec alone runs ~2.5 min locally and stages
    # ~70 fields through the Save round-trip; CI runners are slower. Give
    # generous headroom over the suite's own per-test timeouts so a single
    # pass never brushes the job limit (a brush would otherwise trigger the
    # config's CI retries and stack runtime 3×).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No `cache: 'npm'`: the node_modules cache below already restores the full
      # install on a hit (npm ci is then skipped), so setup-node's npm cache only
      # helped rare lockfile-change runs — while its save post-step's transient
      # cache-service timeouts can fail a release-tag run and skip publish.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 22+: @electron/rebuild 4 declares engines.node >=22.12.
          node-version: '22'

      - name: Cache node_modules + electron caches
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/electron
            ~/.cache/electron-builder
          key: deps-ubuntu-${{ hashFiles('package-lock.json') }}-electron-33

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Ensure xvfb
        # Electron Playwright needs a display server on Linux. `npm test`
        # (scripts/run-playwright.mjs) wraps the suite in its own
        # `xvfb-run -a` so each invocation gets an isolated virtual display
        # — xvfb only needs to be *present* here, not invoked.
        #
        # This was an unconditional `apt-get update && apt-get install -y
        # xvfb` until v4.111.0 lost a release to it. Two things were wrong
        # with that. It never installed anything: ubuntu-latest ships Xvfb
        # (image 20260729.566 carried 2:21.1.12-1ubuntu1.6, and apt reported
        # `0 newly installed`), so the step's 34 s was pure `apt-get update`
        # fetching 11.4 MB of package lists for a package already on disk.
        # And it was unbounded: on run 32231104488 the runner's azure mirror
        # went down, apt failed over to archive.ubuntu.com via the image's
        # mirrorlist, then went silent mid-index for 23 m 53 s — eating the
        # job's whole `timeout-minutes: 25`, which is sized for the suite,
        # and skipping `build`/`publish` so the tag shipped nothing.
        #
        # Hence: probe first, apt only as a fallback for an image that drops
        # xvfb, and then under an external `timeout`. apt's own knobs are not
        # a sufficient bound on their own — v4.111.0 had already burned four
        # connection retries and its mirror failover before it stalled.
        shell: bash
        run: |
          # Bounds every apt in this job, not just the fallback below — most
          # importantly the one `npx playwright install --with-deps` runs a
          # few steps down, which has the same exposure. Acquire::Retries
          # defaults to 0, so today a dropped index fetch is simply lost.
          # Caveat: these bound a *stalled* connection, not a slow-drip
          # mirror that keeps trickling bytes under the inactivity timer.
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'APTCONF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "3";
          APTCONF

          if command -v Xvfb >/dev/null; then
            echo "Xvfb already on the image at $(command -v Xvfb) — skipping apt"
            exit 0
          fi

          echo "Xvfb missing from this runner image; falling back to apt" >&2
          # `sudo timeout`, not `timeout sudo`: this way timeout runs as root
          # and signals apt-get directly instead of relying on sudo to
          # forward SIGTERM. Worst case is 3 x 240 s, well inside the budget.
          for attempt in 1 2 3; do
            echo "::group::apt-get xvfb (attempt $attempt)"
            if sudo timeout 120 apt-get update \
               && sudo timeout 120 apt-get install -y xvfb; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "apt failed on attempt $attempt" >&2
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "could not install xvfb after 3 attempts" >&2
          exit 1

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build renderer + main
        run: npm run build

      # No outer xvfb-run: run-playwright.mjs (behind `npm test`) already
      # wraps the run in xvfb-run; double-wrapping nests two Xvfb servers
      # for no benefit.
      - name: Run Playwright suite
        run: npm test -- --reporter=list

      - name: Upload Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-artefacts
          path: |
            test-results/
            tests/screenshots-out/
          if-no-files-found: ignore
