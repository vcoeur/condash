name: _playwright

# Reusable Electron Playwright lane (Ubuntu + xvfb). Called only by
# release.yml (second stage of the real gate at tag time). Never publishes
# anything.

on:
  workflow_call:

# Least privilege: test-only — checkout, caches, and artifact upload need no
# contents writes (artifact upload uses the runtime token, not GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  playwright:
    name: Playwright suite
    runs-on: ubuntu-latest
    # The settings-modal-audit spec alone runs ~2.5 min locally and stages
    # ~70 fields through the Save round-trip; CI runners are slower. Give
    # generous headroom over the suite's own per-test timeouts so a single
    # pass never brushes the job limit (a brush would otherwise trigger the
    # config's CI retries and stack runtime 3×).
    # Raised from 25 when the bounded apt fallback landed: that fallback did
    # not exist when 25 was chosen, and stacking its worst case on a cold
    # Playwright cache and a full-length suite came to 24.7 min — 18 s of
    # margin, i.e. none. The suite-headroom argument above is unchanged; the
    # suite's own share is still ~5 min. Every step here is individually
    # bounded now, so this is a backstop rather than the primary control.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No `cache: 'npm'`: the node_modules cache below already restores the full
      # install on a hit (npm ci is then skipped), so setup-node's npm cache only
      # helped rare lockfile-change runs — while its save post-step's transient
      # cache-service timeouts can fail a release-tag run and skip publish.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 22+: @electron/rebuild 4 declares engines.node >=22.12.
          node-version: '22'

      - name: Cache node_modules + electron caches
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/electron
            ~/.cache/electron-builder
          key: deps-ubuntu-${{ hashFiles('package-lock.json') }}-electron-33

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # The suite runs headless through `xvfb-run` (scripts/run-playwright.mjs
      # wraps each invocation), so xvfb only needs to be present here.
      # ubuntu-latest ships it, so the probe is the normal path and apt never
      # runs; the action's fallback covers an image that later drops it.
      - name: Ensure xvfb
        uses: ./.github/actions/apt-install
        with:
          packages: xvfb
          # Probe `xvfb-run`, not `Xvfb`: run-playwright.mjs execs the wrapper,
          # and its ENOENT message names it. Same package ships both, so this
          # is about naming the real dependency, not a divergence we expect.
          skip-if-command: xvfb-run

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci

      # `npx playwright install --with-deps` runs apt *inside* itself, out of
      # reach of any argument of ours. The `Ensure xvfb` step above installs
      # /etc/apt/apt.conf.d/99-ci-timeouts for the whole job before its probe
      # runs, so that nested apt inherits the bound — which is why that step
      # is not conditional and must stay ahead of this one.
      # A plain `run:` step, so step-level `timeout-minutes` genuinely applies
      # here — unlike on a composite `uses:` step, where it is inert. The ~80 s
      # healthy figure is a WARM-cache measurement; a `package-lock.json` bump
      # misses the cache above and makes this a cold chromium download plus
      # apt work for its system deps, so size for that, not for the warm run.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Build renderer + main
        run: npm run build

      # No outer xvfb-run: run-playwright.mjs (behind `npm test`) already
      # wraps the run in xvfb-run; double-wrapping nests two Xvfb servers
      # for no benefit.
      - name: Run Playwright suite
        run: npm test -- --reporter=list

      - name: Upload Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-artefacts
          path: |
            test-results/
            tests/screenshots-out/
          if-no-files-found: ignore
